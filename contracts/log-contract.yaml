# ============================================================
# Argus Log Contract  —  source of truth for all structured log events.
#
# RULES
#   • Add events here first; the Maven codegen plugin generates the Java records.
#   • Never define ad-hoc log calls in application code.
#   • Attribute names follow OpenTelemetry semantic conventions (dot-separated).
#   • Enums are per-domain; use the narrowest applicable outcome for each event.
#   • String fields without an explicit max_length default to string_limits.default_max_length.
#   • Required fields that are null at emit-time cause an IllegalArgumentException.
#   • Optional string fields that exceed max_length are silently truncated.
# ============================================================

version: "1.0"
namespace: "com.argus.logging.events"

string_limits:
  default_max_length: 512    # applied to every string field with no explicit max_length
  override_max_length: 4096  # explicit max_length values must not exceed this

# ============================================================
# MANDATORY OTel LOG RECORD ENVELOPE
#
# These fields are present on EVERY log record emitted by this framework.
# They are managed entirely by ArgusLogger / the OTel SDK — event definitions
# must NOT redeclare them as attributes.
#
# Field                       Source                               Notes
# ─────────────────────────── ──────────────────────────────────── ──────────────────────────────────────────
# Timestamp                   OTel SDK (auto)                      Nanosecond epoch at emit() time.
# ObservedTimestamp           OTel SDK (auto)                      Nanosecond epoch when SDK observed record.
# TraceId                     OTel SDK (from active span)          128-bit. Present when a span is active.
# SpanId                      OTel SDK (from active span)          64-bit.  Present when a span is active.
# TraceFlags                  OTel SDK (from active span)          W3C trace flags byte.
# SeverityNumber              Event 'severity' definition          Numeric level per OTel spec (DEBUG=5, INFO=9, WARN=13, ERROR=17).
# SeverityText                Event 'severity' definition          Human-readable level string (e.g. INFO).
# Body                        Event 'body' template                Rendered human-readable message (AnyValue/string).
# event.name  [→ EventName]   Event key in this contract           Identifies the event class/type per data-model §EventName.
#                                                                  Set as the event.name attribute; collectors map it to EventName.
# service.name                ArgusLoggerFactory / OTEL_SERVICE_NAME env         Resource attribute.
# service.version             ArgusLoggerFactory / OTEL_SERVICE_VERSION env      Resource attribute.
# deployment.environment.name ArgusLoggerFactory / DEPLOYMENT_ENVIRONMENT env    Resource attribute.
# InstrumentationScope        ArgusLoggerFactory (com.argus.logging)             Identifies the logging library.
# ============================================================

# ============================================================
# ERROR ENVELOPE
#
# Automatically appended as OPTIONAL fields to every event with severity ERROR or WARN.
# The codegen plugin injects these into the generated record so callers can pass them
# directly, or use ArgusLogger.emit(event, throwable) to have the framework extract
# them from the exception automatically.
#
# Attribute             Type    max_length  Description
# ─────────────────────────────────────────────────────────────────────────────
# exception.type        string     256      FQCN of the exception class.
# exception.message     string    4096      Throwable.getMessage() value.
# exception.stacktrace  string    4096      Full stack trace. Truncated at limit.
# error.type            string     128      Short category for grouping / alerting.
# ============================================================
error_envelope:
  exception.type:
    type: string
    description: "Fully-qualified class name of the thrown exception (e.g. java.net.SocketTimeoutException)."
    max_length: 256
  exception.message:
    type: string
    description: "Exception message returned by Throwable.getMessage()."
    max_length: 4096
  exception.stacktrace:
    type: string
    description: "Full stack trace as a string. Truncated to max_length when necessary."
    max_length: 4096
  error.type:
    type: string
    description: "Short error category used for grouping and alerting (e.g. TimeoutError, ValidationError)."
    max_length: 128

# ============================================================
# PER-DOMAIN OUTCOME ENUMS
# ============================================================
enums:

  HttpOutcome:
    description: "Outcome of an inbound or outbound HTTP request"
    values: [SUCCESS, CLIENT_ERROR, SERVER_ERROR, TIMEOUT, UNKNOWN]

  DataOutcome:
    description: "Outcome of a data-store or cache operation"
    values: [SUCCESS, FAILURE, NOT_FOUND, CACHE_HIT, CACHE_MISS]

  AsyncOutcome:
    description: "Outcome of async / event-driven message processing"
    values: [SUCCESS, FAILURE, SKIPPED, RETRIED, DEAD_LETTERED]

  BusinessOutcome:
    description: "Outcome of a business-logic step or workflow node"
    values: [SUCCESS, FAILURE, PARTIAL, REJECTED, DEFERRED]

# ============================================================
# EVENTS
# Keys are the canonical OTel event names (dot-separated, past tense).
# Each event generates one Java record that implements LogEvent.
#
# severity: INFO | DEBUG | WARN | ERROR
#   ERROR events automatically receive the error_envelope fields (see above).
# ============================================================
events:

  # ----------------------------------------------------------
  # HTTP / REST — INFO (normal completion)
  # ----------------------------------------------------------
  http.request.completed:
    severity: INFO
    description: "An inbound or outbound HTTP request completed normally"
    body: "{http.method} {http.route} -> {http.response.status_code} [{outcome}] in {duration.ms}ms"
    attributes:
      http.method:
        type: string
        required: true
        max_length: 10
      http.route:
        type: string
        required: true
        max_length: 256
      http.response.status_code:
        type: int
        required: true
      duration.ms:
        type: long
        required: true
      outcome:
        type: enum
        enum: HttpOutcome
        required: true
      outcome.reason:
        type: string
        max_length: 512

  http.client.request.completed:
    severity: INFO
    description: "An outbound HTTP call to an upstream service completed normally"
    body: "{http.method} {server.address}{http.route} -> {http.response.status_code} [{outcome}] in {duration.ms}ms"
    attributes:
      http.method:
        type: string
        required: true
        max_length: 10
      server.address:
        type: string
        required: true
        max_length: 256
      http.route:
        type: string
        required: true
        max_length: 256
      http.response.status_code:
        type: int
        required: true
      duration.ms:
        type: long
        required: true
      outcome:
        type: enum
        enum: HttpOutcome
        required: true
      outcome.reason:
        type: string
        max_length: 512

  # ----------------------------------------------------------
  # HTTP / REST — ERROR (unhandled failure)
  # error_envelope fields (exception.*) are auto-injected by codegen.
  # ----------------------------------------------------------
  http.request.failed:
    severity: ERROR
    description: "An HTTP request failed with an unhandled exception or fatal error"
    body: "{http.method} {http.route} FAILED [{outcome}] after {duration.ms}ms — {error.type}"
    attributes:
      http.method:
        type: string
        required: true
        max_length: 10
      http.route:
        type: string
        required: true
        max_length: 256
      duration.ms:
        type: long
        required: true
      outcome:
        type: enum
        enum: HttpOutcome
        required: true
      error.type:
        type: string
        required: true
        max_length: 128

  # ----------------------------------------------------------
  # ASYNC / EVENT-DRIVEN — INFO
  # ----------------------------------------------------------
  async.event.processed:
    severity: INFO
    description: "An async message or domain event was processed"
    body: "Event {event.type} [{event.id}] from {event.source} -> {outcome}"
    attributes:
      event.type:
        type: string
        required: true
        max_length: 128
      event.source:
        type: string
        required: true
        max_length: 128
      event.id:
        type: string
        max_length: 64
      outcome:
        type: enum
        enum: AsyncOutcome
        required: true
      outcome.reason:
        type: string
        max_length: 512
      retry.count:
        type: int
      duration.ms:
        type: long

  async.event.published:
    severity: INFO
    description: "A domain event was published to a message broker"
    body: "Published {event.type} [{event.id}] to {messaging.destination} [{outcome}]"
    attributes:
      event.type:
        type: string
        required: true
        max_length: 128
      event.id:
        type: string
        max_length: 64
      messaging.destination:
        type: string
        required: true
        max_length: 256
      outcome:
        type: enum
        enum: AsyncOutcome
        required: true
      outcome.reason:
        type: string
        max_length: 512

  # ----------------------------------------------------------
  # ASYNC / EVENT-DRIVEN — ERROR
  # ----------------------------------------------------------
  async.event.failed:
    severity: ERROR
    description: "An async event could not be processed and will not be retried"
    body: "Event {event.type} [{event.id}] from {event.source} FAILED — {error.type}"
    attributes:
      event.type:
        type: string
        required: true
        max_length: 128
      event.source:
        type: string
        required: true
        max_length: 128
      event.id:
        type: string
        max_length: 64
      retry.count:
        type: int
      error.type:
        type: string
        required: true
        max_length: 128

  # ----------------------------------------------------------
  # DATABASE / CACHE — DEBUG
  # ----------------------------------------------------------
  db.operation.executed:
    severity: DEBUG
    description: "A database query or command was executed"
    body: "{db.operation.name} on {db.collection.name} [{outcome}] in {duration.ms}ms"
    attributes:
      db.operation.name:
        type: string
        required: true
        max_length: 64
      db.collection.name:
        type: string
        required: true
        max_length: 128
      duration.ms:
        type: long
        required: true
      rows.affected:
        type: int
      outcome:
        type: enum
        enum: DataOutcome
        required: true
      outcome.reason:
        type: string
        max_length: 512

  cache.operation.result:
    severity: DEBUG
    description: "A cache read or write completed"
    body: "Cache {cache.operation} [{cache.key.prefix}*] -> {outcome}"
    attributes:
      cache.operation:
        type: string
        required: true
        max_length: 16
      cache.key.prefix:
        type: string
        required: true
        max_length: 128
      outcome:
        type: enum
        enum: DataOutcome
        required: true
      duration.ms:
        type: long

  # ----------------------------------------------------------
  # DATABASE — ERROR
  # ----------------------------------------------------------
  db.operation.failed:
    severity: ERROR
    description: "A database operation failed with an unhandled exception"
    body: "{db.operation.name} on {db.collection.name} FAILED — {error.type}"
    attributes:
      db.operation.name:
        type: string
        required: true
        max_length: 64
      db.collection.name:
        type: string
        required: true
        max_length: 128
      error.type:
        type: string
        required: true
        max_length: 128

  # ----------------------------------------------------------
  # BUSINESS LOGIC — INFO
  # ----------------------------------------------------------
  business.step.completed:
    severity: INFO
    description: "A named business-logic step or workflow node completed"
    body: "Step [{step.name}] in flow [{flow.name}] -> {outcome}"
    attributes:
      step.name:
        type: string
        required: true
        max_length: 128
      flow.name:
        type: string
        required: true
        max_length: 128
      entity.type:
        type: string
        max_length: 64
      entity.id:
        type: string
        max_length: 64
      outcome:
        type: enum
        enum: BusinessOutcome
        required: true
      outcome.reason:
        type: string
        max_length: 512
      duration.ms:
        type: long

  business.rule.evaluated:
    severity: DEBUG
    description: "A business rule or policy was evaluated"
    body: "Rule [{rule.name}] on {entity.type} [{entity.id}] -> {outcome}"
    attributes:
      rule.name:
        type: string
        required: true
        max_length: 128
      entity.type:
        type: string
        required: true
        max_length: 64
      entity.id:
        type: string
        required: true
        max_length: 64
      outcome:
        type: enum
        enum: BusinessOutcome
        required: true
      outcome.reason:
        type: string
        max_length: 512

  # ----------------------------------------------------------
  # BUSINESS LOGIC — ERROR
  # ----------------------------------------------------------
  business.step.failed:
    severity: ERROR
    description: "A business-logic step failed with an unhandled exception"
    body: "Step [{step.name}] in flow [{flow.name}] FAILED — {error.type}"
    attributes:
      step.name:
        type: string
        required: true
        max_length: 128
      flow.name:
        type: string
        required: true
        max_length: 128
      entity.type:
        type: string
        max_length: 64
      entity.id:
        type: string
        max_length: 64
      error.type:
        type: string
        required: true
        max_length: 128
